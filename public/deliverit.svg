<?xml version="1.0" encoding="UTF-8"?>
<!--
  Deliver.it logo: flat-design yellow gift box whose red ribbon loops into a "D" bow.
  Original artwork, dedicated to the public domain under CC0 1.0 Universal:
  https://creativecommons.org/publicdomain/zero/1.0/
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Deliver.it</title>
  <defs>
    <clipPath id="disc"><circle cx="128" cy="128" r="120"/></clipPath>
  </defs>

  <circle cx="128" cy="128" r="120" fill="#ECF0F1"/>

  <g clip-path="url(#disc)">
    <!-- long shadow, the 2014 flat-design staple -->
    <polygon points="48,86 216,86 416,286 416,404 248,404 48,204" fill="#2C3E50" opacity="0.12"/>

    <!-- box body and lid -->
    <rect x="56" y="112" width="152" height="92" rx="4" fill="#F1C40F"/>
    <rect x="48" y="86" width="168" height="30" rx="4" fill="#F39C12"/>

    <!-- ribbon wrapping up the front and over the lid -->
    <rect x="118" y="86" width="20" height="118" fill="#C0392B"/>

    <!-- the bow: a ribbon loop shaped like a "D" -->
    <path transform="translate(5 0)" fill="#E74C3C" fill-rule="evenodd"
          d="M96 30 H122 A28 28 0 0 1 122 86 H96 Z
             M114 46 V70 H122 A12 12 0 0 0 122 46 Z"/>
  </g>
</svg>
